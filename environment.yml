# The environment mdprep is developed and tested in, and everything the
# tutorials need. `conda env create -f environment.yml` then `conda activate
# mdprep` is the whole install: AmberTools, xTB and PropKa are external
# programs mdprep calls, so they belong here rather than in pip metadata.
#
# Versions are pinned so a prepared system can be reproduced later. Use
# environment-minimal.yml instead if you only want to read or validate
# manifests.
#
# Not included, and not installable from here:
#   ASH, for refinement.backend: ash. It is a manual checkout from
#   https://github.com/RagnarB83/ash and is NOT the `ash` package on PyPI,
#   which is unrelated software. The default force-field refinement backend
#   needs none of this; see docs/qmmm_refinement.md.
name: mdprep
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=26.1.2
  - hatchling=1.30.1
  # Core.
  - typer=0.26.7
  - rich=15.0.0
  - pydantic=2.13.4
  - pydantic-settings=2.14.1
  - pyyaml=6.0.3
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.3
  # External chemistry programs mdprep drives.
  - ambertools=24.8     # tleap, antechamber, parmchk2, MCPB.py
  - propka=3.5.1        # protonation.method: propka, propka_xtb_his
  - xtb=6.7.1           # histidine tautomers, GFN2 charges and Hessians
  # Python chemistry libraries.
  - openmm=8.5.2        # force-field refinement, MM point charges, validation
  - pdbfixer=1.12       # structure.repair, temporary hydrogenation
  - rdkit=2024.09.2     # ligands[].smiles hydrogen placement
  - parmed=4.3.1        # topology validation, QMMESP point charges
  - pyscf=2.13.1        # QMMESP and MCPB RESP fitting
  - geometric=1.1.1     # optimizer ASH drives, harmless otherwise
  # Tests.
  - pytest=9.0.3
  - pip:
      - -e .
