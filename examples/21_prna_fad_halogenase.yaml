# PrnA, the tryptophan 7-halogenase (PDB 2AR8): a flavin-dependent
# halogenase with its FAD and its product.
#
# The reference case for an organic cofactor whose chemistry its name
# fixes. 2AR8 holds FAD, 7-chloro-L-tryptophan (CTE) and a chloride; no
# metal. See tutorials/prna_2ar8/README.md.
#
# Written by the decision engine (mdprep init --interactive) with these
# answers:
#   * FAD SMILES, charge -2  proposed: oxidised FAD, the diphosphate fully
#                            ionised, as the deposition holds it.
#   * CTE SMILES, charge 0   7-chloro-L-tryptophan as a zwitterion, typed in:
#                            nothing proposes a product's chemistry.
#   * chloride kept          a crystal ion, built from Amber's ion library.
project:
  name: prna_2ar8
  input_structure: tutorials/prna_2ar8/2AR8.pdb
  output_dir: prepared/prna_2ar8
structure:
  keep_chains: []
  keep_crystal_waters: true
  keep_crystal_ions: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true
protein:
  forcefield: ff14SB
  water_model: TIP3P
protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides: []
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      model: gfn2
      mode: sp
      num_threads: 1
disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []
ligands:
- id: a_cte_650
  selector:
    chain: A
    resname: CTE
    resid: 650
    icode: null
  net_charge: 0
  multiplicity: 1
  atom_types: gaff2
  charge_method: am1bcc
  smiles: '[NH3+]C(Cc1c[nH]c2c(Cl)cccc12)C(=O)[O-]'
- id: a_fad_600
  selector:
    chain: A
    resname: FAD
    resid: 600
    icode: null
  net_charge: -2
  multiplicity: 1
  atom_types: gaff2
  charge_method: am1bcc
  smiles: Cc1cc2nc3c(=O)[nH]c(=O)nc-3n(CC(O)C(O)C(O)COP(=O)([O-])OP(=O)([O-])OCC3OC(n4cnc5c(N)ncnc54)C(O)C3O)c2cc1C
metals: []
refinement:
  enabled: false
solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-
validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
molecular_dynamics:
  enabled: false
