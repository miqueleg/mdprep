project:
  name: bonded_zinc_mcpb_prepare
  input_structure: data/protein_zinc_substrate.pdb
  output_dir: prepared/bonded_zinc_mcpb

structure:
  keep_crystal_waters: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true

protein:
  forcefield: ff19SB
  water_model: TIP3P

protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides:
    - selector:
        chain: A
        resname: CYS
        resid: 46
        icode: null
      state: CYM
      reason: Explicit thiolate state for the declared Zn-S coordination bond
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      executable: xtb
      model: gfn2
      mode: opt
      opt_level: loose
      solvent: water
      cutoff_angstrom: 5.0
      extra_args: []

disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []

ligands:
  - id: substrate_sub
    selector:
      chain: L
      resname: SUB
      resid: 401
      icode: null
    net_charge: -1
    multiplicity: 1
    atom_types: gaff2
    charge_method: am1bcc
    user_mol2: null
    user_frcmod: null
    qmmesp: null

metals:
  - id: catalytic_zinc
    model: bonded_mcpb
    ions:
      - selector: &zinc
          chain: Z
          resname: ZN
          resid: 500
          icode: null
          atom_name: ZN
        element: Zn
        charge: 2
    mcpb:
      executable: MCPB.py
      workflow: prepare_inputs
      provisional_nonbonded_parameter_set: "12_6"
      cutoff_angstrom: 2.8
      bonds:
        - ion: *zinc
          coordinator:
            chain: A
            resname: HIS
            resid: 42
            icode: null
            atom_name: NE2
        - ion: *zinc
          coordinator:
            chain: A
            resname: CYS
            resid: 46
            icode: null
            atom_name: SG
        - ion: *zinc
          coordinator:
            chain: L
            resname: SUB
            resid: 401
            icode: null
            atom_name: O1
      additional_residues: []
      force_constant_method: seminario
      charge_restraint: backbone_heavy
      software_version: g16
      # Placeholder values: recompute charge and multiplicity from the actual
      # capped small/large models generated for your structure.
      small_model_charge: 0
      small_model_spin: 1
      large_model_charge: 0
      large_model_spin: 1
      scale_factor: 1.0
      large_opt: 0
      artifacts: null

solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-

validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
