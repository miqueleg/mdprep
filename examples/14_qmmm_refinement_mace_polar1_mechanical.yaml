project:
  name: qmmm_refined_mace_polar1_substrate
  input_structure: data/enzyme_substrate.pdb
  output_dir: prepared/qmmm_refined_mace_polar1_substrate

structure:
  keep_crystal_waters: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true

protein:
  forcefield: ff14SB
  water_model: TIP3P

protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides:
    - selector: {chain: A, resname: ASP, resid: 127, icode: null}
      state: ASP
      reason: Catalytic base must remain deprotonated
  histidine:
    neutral_tautomer_method: xtb

disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []

ligands:
  - id: substrate
    selector: {chain: B, resname: SUB, resid: 501, icode: null}
    net_charge: 0
    multiplicity: 1
    atom_types: gaff2
    charge_method: am1bcc

refinement:
  enabled: true
  backend: ash
  qm_method: mace_polar1
  embedding: mechanical
  qm_components:
    ligands: [substrate]
    metal_sites: []
    metal_coordinating_residues: {}
  active_region_cutoff_angstrom: 4.0
  active_water_cutoff_angstrom: 8.0
  include_contact_waters: true
  total_qm_multiplicity: null
  ash:
    python_executable: python
    max_iterations: 250
    num_cores: 4
    platform: CPU
  mace_polar1:
    model: polar-1-m
    model_path: models/MACEPOLAR1Mmodel
    expected_model_sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    device: cpu
    python_search_paths: []
    # Set true only after reviewing and accepting the MACE-POLAR-1 license.
    accept_model_license: true

solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-

validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
