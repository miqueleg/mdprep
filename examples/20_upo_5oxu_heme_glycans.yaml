protein:
  forcefield: ff14SB
  water_model: TIP3P
protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides:
  - selector:
      chain: A
      resname: CYS
      resid: 36
      icode: null
    state: CYM
    reason: Coordinates a metal modelled with bonded MCPB; stated by the user because
      coordination alone does not distinguish the neutral and ionised forms.
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      model: gfn2
      mode: sp
      num_threads: 1
disulfides:
