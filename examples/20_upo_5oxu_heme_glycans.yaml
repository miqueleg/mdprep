# An unspecific peroxygenase, UPO (PDB 5OXU): a heme-thiolate peroxygenase
# that halogenates as well as oxygenates, and a glycoprotein.
#
# The reference case for heterogens that are not ligands. 5OXU is the
# evolved Agrocybe aegerita peroxygenase: one chain, its heme bonded to
# Cys36 as in a P450, a magnesium held by the heme's propionate, five
# N-acetylglucosamines bonded to asparagines, and the phosphate, glycerol and
# methanol it was crystallised from. See tutorials/upo_5oxu/README.md.
#
# Written by the decision engine (mdprep init --interactive) with these
# answers:
#   * glycans removed        the default: mdprep does not build sugars
#                            bonded to the protein, and none is near the heme.
#   * additives removed      the default: 1 phosphate, 3 glycerols and 10
#                            methanols, each listed under remove_residues.
#   * Fe charge 3            the resting state, with a water across the heme
#                            from the cysteine: low-spin Fe(III), so the QM
#                            region's spin is 2.
#   * Cys36 as CYM           the proximal thiolate.
#   * model charge -2        Fe(3+) + porphyrin(4-) + thiolate(1-) + water(0),
#                            proposed from the answers above.
#   * HEM SMILES, charge -4  proposed, as for any heme b.
#   * Mg nonbonded, +2       the default for magnesium: a closed-shell ion
#                            held by electrostatics.
project:
  name: upo_5oxu
  input_structure: tutorials/upo_5oxu/5OXU.pdb
  output_dir: prepared/upo_5oxu
structure:
  keep_chains: []
  keep_crystal_waters: true
  keep_crystal_ions: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true
  remove_residues:
