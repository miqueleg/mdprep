# SpoIIAA phosphorylated on Ser57 (PDB 1H4X): a phosphoserine kept in its
# chain.
#
# The reference case for a noncanonical residue kept as it is rather than
# replaced by its parent. 1H4X holds two copies of the protein, each with
# SEP57 and a Tris from the buffer; chain B is prepared. See
# tutorials/spoiiaa_1h4x/README.md and docs/noncanonical_residues.md.
#
# Written by the decision engine (mdprep init --interactive) with these
# answers:
#   * chain B only           one copy of the protein, which is a monomer in
#                            solution.
#   * SEP kept, with         phosaa14SB's SEP, the phosphate dianionic,
#     AmberTools' template   net charge -2 (proposed: the phosphate's second
#                            pKa is about 6).
#   * Tris removed           a crystallisation additive.
#
# The other way to keep it parameterises the residue from its SMILES:
#
#   noncanonical_residues:
#   - resname: SEP
#     residues:
#     - {chain: B, resname: SEP, resid: 57}
#     parameters: am1bcc
#     smiles: CC(=O)NC(COP(=O)([O-])[O-])C(=O)NC
#     net_charge: -2
#     parent: SER
#
# and with parameters: qmmesp_pyscf, plus
#
#     qmmesp:
#       method: HF
#       basis: 6-31G*
#
# fits its charges instead to the ESP of the capped residue polarised by the
# rest of chain B, its waters and their charges, the backbone held at ff14SB's
# (docs/noncanonical_residues.md, "QMMESP charges").
project:
  name: spoiiaa_1h4x
  input_structure: tutorials/spoiiaa_1h4x/1H4X.pdb
  output_dir: prepared/spoiiaa_1h4x
structure:
  keep_chains:
  - B
  keep_crystal_waters: true
  keep_crystal_ions: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true
  remove_residues:
  - selector:
      chain: B
      resname: TRS
      resid: 1113
      icode: null
    reason: crystallisation additive (Tris)
protein:
  forcefield: ff14SB
  water_model: TIP3P
protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides: []
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      model: gfn2
      mode: sp
      num_threads: 1
disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []
ligands: []
metals: []
noncanonical_residues:
- resname: SEP
  residues:
  - chain: B
    resname: SEP
    resid: 57
    icode: null
  parameters: amber_library
  template: SEP
refinement:
  enabled: false
solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-
validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
molecular_dynamics:
  enabled: false
