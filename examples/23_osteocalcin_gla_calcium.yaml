# Porcine osteocalcin (PDB 1Q8H): three gamma-carboxyglutamates kept in
# their chain, and the calcium ions they bind.
#
# The reference case for a metal on a noncanonical residue. Osteocalcin's
# Gla residues 17, 21 and 24 are glutamates the vitamin K-dependent
# carboxylase has given a second carboxylate; replaced by their parent they
# would lose the malonate that holds the calcium. Three Ca2+ sit on Gla24
# in the deposited copy, one of them on Asp30 as well. See
# tutorials/osteocalcin_1q8h/README.md and docs/noncanonical_residues.md.
#
# Written by the decision engine (mdprep init --interactive) with these
# answers:
#   * CGU kept, from its     both carboxylates ionised, net charge -2, with
#     SMILES (AM1-BCC)       Glu as its parent (proposed: their pKa values
#                            are well below 7).
#   * Each Ca2+ nonbonded    a closed-shell ion held by electrostatics, which
#                            an ion model describes (proposed).
#
# The Gla residues' charges can instead be fitted to the ESP of the capped
# residue polarised by everything around it -- the calcium ions' +2 among it:
#
#   parameters: qmmesp_pyscf
#   qmmesp:
#     method: HF
#     basis: 6-31G*
#
# On 1Q8H that fit gives the methine between the two carboxylates +1.2 e and
# its hydrogen -0.5, which mdprep reports as a warning: RESP lets an atom the
# ESP outside the molecule barely sees trade charge with its neighbours. See
# docs/noncanonical_residues.md, "QMMESP charges".
project:
  name: osteocalcin_1q8h
  input_structure: tutorials/osteocalcin_1q8h/1Q8H.pdb
  output_dir: prepared/osteocalcin_1q8h
structure:
  keep_chains: []
  keep_crystal_waters: true
  keep_crystal_ions: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: false
  preserve_chain_ids: true
  remove_input_hydrogens: true
protein:
  forcefield: ff14SB
  water_model: TIP3P
protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides: []
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      model: gfn2
      mode: sp
      num_threads: 1
disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []
ligands: []
metals:
- id: a_ca_71_site
  model: nonbonded
  ions:
  - selector:
      chain: A
      resname: CA
      resid: 71
      icode: null
      atom_name: CA
    element: Ca
    charge: 2
  nonbonded:
    parameter_set: '12_6'
- id: a_ca_72_site
  model: nonbonded
  ions:
  - selector:
      chain: A
      resname: CA
      resid: 72
      icode: null
      atom_name: CA
    element: Ca
    charge: 2
  nonbonded:
    parameter_set: '12_6'
- id: a_ca_73_site
  model: nonbonded
  ions:
  - selector:
      chain: A
      resname: CA
      resid: 73
      icode: null
      atom_name: CA
    element: Ca
    charge: 2
  nonbonded:
    parameter_set: '12_6'
noncanonical_residues:
- resname: CGU
  residues:
  - chain: A
    resname: CGU
    resid: 17
    icode: null
  - chain: A
    resname: CGU
    resid: 21
    icode: null
  - chain: A
    resname: CGU
    resid: 24
    icode: null
  parameters: am1bcc
  smiles: CC(=O)NC(CC(C(=O)[O-])C(=O)[O-])C(=O)NC
  net_charge: -2
  parent: GLU
refinement:
  enabled: false
solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-
validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
molecular_dynamics:
  enabled: false
