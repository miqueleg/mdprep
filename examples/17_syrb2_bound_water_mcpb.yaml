# SyrB2, a halogenase with a water on its iron (PDB 2FCT).
#
# The reference case for a water bound to a bonded metal. Six-coordinate
# Fe(II): His116, His235, alpha-ketoglutarate bidentate, Cl901, and HOH1072 --
# the water sits where O2 later binds. See tutorials/syrb2_2fct/README.md.
#
# Written by the decision engine (mdprep init --interactive) with these
# answers, none of them inferred:
#   * keep_chains: [A]       2FCT is two copies; MCPB inputs are single-chain.
#   * Fe charge 2, spin 5    high-spin d6 Fe(II); the QM region is a quintet.
#   * small/large model -1   Fe(2+) + AKG(2-) + Cl(1-) + 2 x His(0) + water(0).
#   * six explicit bonds     measured at 2.03-2.47 A in the deposition.
#   * TIP3P                  a water in the MCPB model needs a three-point water.
#
# keep_crystal_ions keeps the free chloride CL903; remove_unknown_heterogens
# lets the detergent DSU896 go.
project:
  name: syrb2_2fct
  input_structure: tutorials/syrb2_2fct/2FCT.pdb
  output_dir: prepared/syrb2_2fct
structure:
  keep_chains:
  - A
  keep_crystal_waters: true
  keep_crystal_ions: true
  altloc_policy: highest_occupancy
  remove_unknown_heterogens: true
  preserve_chain_ids: true
  remove_input_hydrogens: true
  repair:
    backend: pdbfixer
    add_missing_heavy_atoms: true
    unresolved_residues: leave_absent
protein:
  forcefield: ff14SB
  water_model: TIP3P
protonation:
  ph: 7.0
  method: propka_xtb_his
  overrides: []
  histidine:
    neutral_tautomer_method: xtb
    xtb:
      model: gfn2
      mode: sp
      num_threads: 1
disulfides:
  auto_detect: true
  detection_cutoff_angstrom: 2.2
  force: []
  forbid: []
ligands:
- id: a_akg_897
  selector:
    chain: A
    resname: AKG
    resid: 897
    icode: null
  net_charge: -2
  multiplicity: 1
  atom_types: gaff2
  charge_method: mcpb_resp_pyscf
  smiles: '[O-]C(=O)CCC(=O)C(=O)[O-]'
metals:
- id: a_fe2_900_site
  model: bonded_mcpb
  ions:
  - selector:
      chain: A
      resname: FE2
      resid: 900
      icode: null
      atom_name: FE
    element: Fe
    charge: 2
    multiplicity: 5
  coordinating_ions:
  - selector:
      chain: A
      resname: CL
      resid: 901
      icode: null
      atom_name: CL
    element: Cl
    charge: -1
  mcpb:
    workflow: pyscf
    provisional_nonbonded_parameter_set: '12_6'
    cutoff_angstrom: 2.6
    bonds:
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: AKG
        resid: 897
        icode: null
        atom_name: O2
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: HIS
        resid: 116
        icode: null
        atom_name: NE2
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: AKG
        resid: 897
        icode: null
        atom_name: O5
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: HIS
        resid: 235
        icode: null
        atom_name: NE2
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: HOH
        resid: 1072
        icode: null
        atom_name: O
    - ion:
        chain: A
        resname: FE2
        resid: 900
        icode: null
        atom_name: FE
      coordinator:
        chain: A
        resname: CL
        resid: 901
        icode: null
        atom_name: CL
    additional_residues: []
    force_constant_method: seminario
    charge_restraint: backbone_heavy
    software_version: gau
    small_model_charge: -1
    small_model_spin: 5
    large_model_charge: -1
    large_model_spin: 5
    pyscf:
      geometry_source: qmmm_refinement
      hessian_backend: xtb
      esp_backend: xtb
      method: B3LYP
      basis: 6-31G*
      xtb:
        model: gxtb
        num_threads: 8
refinement:
  enabled: true
  backend: openmm
  qm_method: gfn2_xtb
  qm_components:
    ligands:
    - a_akg_897
    metal_sites:
    - a_fe2_900_site
    metal_coordinating_residues: {}
  active_region_cutoff_angstrom: 4.0
  active_water_cutoff_angstrom: 8.0
  include_contact_waters: true
  movable_atoms: active_region_hydrogens
  post_refinement_protonation: reuse_initial
  total_qm_multiplicity: 5
  ash:
    python_executable: python
    xtb_executable: xtb
    allow_unusual_link_boundaries: true
    num_cores: 4
    platform: CPU
solvation:
  enabled: true
  box: truncated_octahedron
  buffer_angstrom: 10.0
  neutralize: true
  salt_concentration_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-
validation:
  run_openmm_energy_check: true
  fail_on_warnings: false
  fail_on_missing_parameters: true
  fail_on_noninteger_ligand_charge: true
molecular_dynamics:
  enabled: false
