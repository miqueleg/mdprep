[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mdprep"
version = "0.5.3"
description = "Reproducible Amber preparation for proteins, ligands, metal centers, and OpenMM MD."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Miquel Estévez Gay" }
]
keywords = ["amber", "molecular-dynamics", "protein", "ligand", "metal", "mcpb", "openmm", "resp", "qmmm", "pyscf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Preparing a system also needs AmberTools, xTB and PropKa, which are
# programs rather than Python packages. conda is the only sane way to get
# them, so environment.yml is the supported install; these extras exist for
# a pip-only environment that already has the executables on PATH.
md = [
  "openmm>=8.1",
  "pdbfixer>=1.9",
]
qm = [
  "pyscf>=2.6",
  "parmed>=4.2",
]
ligands = [
  "rdkit>=2023.3",
]
# Everything the tutorials exercise, except the external programs.
all = [
  "openmm>=8.1",
  "pdbfixer>=1.9",
  "pyscf>=2.6",
  "parmed>=4.2",
  "rdkit>=2023.3",
]
test = [
  "pytest>=8",
]
dev = [
  "pytest>=8",
  "build>=1",
  "twine>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]
docs = [
  "mkdocs>=1.6",
]

[project.urls]
Homepage = "https://github.com/miqueleg/mdprep"
Issues = "https://github.com/miqueleg/mdprep/issues"

[project.scripts]
mdprep = "mdprep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mdprep"]

# Hatchling ignores MANIFEST.in, which is a setuptools file, and otherwise
# packs whatever is in the working tree. That made the sdist depend on what a
# developer happened to have lying around: a structure dropped in the root
# once put 82 MB of it into the distribution, and web/vendor/ -- a build
# artifact that is deliberately not committed -- carried a stale wheel of the
# previous release. Say what the project is instead.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/web",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/AGENTS.md",
  "/CITATION.cff",
  "/LICENSE",
  "/pyproject.toml",
  "/environment.yml",
  "/environment-dev.yml",
  "/environment-minimal.yml",
]
exclude = [
  "/web/vendor",
  "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "external: tests requiring optional external executables",
  "ambertools: tests requiring optional AmberTools executables",
  "tleap: tests requiring optional tleap executable",
  "openmm: tests requiring optional OpenMM package",
  "parmed: tests requiring optional ParmEd package",
  "pyscf: tests requiring optional PySCF package",
  "qmmesp: tests requiring optional QMMESP-style integration dependencies",
  "propka: tests requiring optional PropKa executable",
  "xtb: tests requiring optional xTB executable",
  "mace: tests requiring optional MACE-POLAR-1 dependencies and checkpoint",
  "pymol: tests requiring optional PyMOL (pymol-open-source)",
  "slow: slow tests excluded from quick CI runs",
]
